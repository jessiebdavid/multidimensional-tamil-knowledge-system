[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multidimensional-tamil-knowledge-system"
version = "0.1.0"
description = "A multidimensional Tamil knowledge system connecting classical Tamil concepts with scientific knowledge."
requires-python = ">=3.11"
dependencies = [
    "tavily-python",
    "python-dotenv"
]

[tool.setuptools]
package-dir = { "tamil_rag" = "src/tamil_rag" }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "scientific*",
    "shared*",
    "processing*",
    "integration*",
    "tamil_rag*"
]